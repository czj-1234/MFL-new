name: ASLWF paper reproduction guards

on:
  push:
    branches: [paper-aslwf-repro-20261017, aslwf-final16-two-servers-20261022]
    paths:
      - 'docs/paper_repro/**'
      - 'scripts/acm_revision/**'
      - 'src/acm_revision/**'
      - 'tests/test_paper_repro.py'
      - 'tests/test_supplement16_static.py'
      - '.github/workflows/paper-aslwf-repro-ci.yml'
  workflow_dispatch:

jobs:
  reproducibility-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight manifest parser
        run: python -m pip install PyYAML numpy pandas Pillow
      - name: Compile full federated reproduction source
        run: python -m compileall -q src/acm_revision scripts/acm_revision tests/test_paper_repro.py
      - name: Check all reproduction shell scripts
        run: |
          for f in scripts/acm_revision/*.sh; do bash -n "$f"; done
      - name: Compile paper tooling
        run: python -m py_compile src/acm_revision/paper_protocol_plan.py src/acm_revision/l2_reference.py src/acm_revision/defense_dispatch.py src/acm_revision/defense70_plan.py src/acm_revision/defense70_prepare.py src/acm_revision/headfix_plan.py scripts/acm_revision/paper_repro_preflight.py scripts/acm_revision/audit_headfix.py scripts/acm_revision/verify_paper_table7.py tests/test_paper_repro.py
      - name: Validate two-server supplement16 source and exact job matrix
        run: |
          python -m py_compile src/acm_revision/supplement16.py src/acm_revision/supplement16_distortion.py
          bash -n scripts/acm_revision/serverA_uncentered_8.sh
          bash -n scripts/acm_revision/serverB_c09_8.sh
          python -m unittest discover -s tests -p 'test_supplement16_static.py' -v
      - name: Generate all 72 canonical Core72 configs
        run: |
          python -m src.acm_revision.paper_protocol_plan --stage core --output /tmp/paper_repro_ci
          python - <<'PY'
          import pathlib
          import yaml
          configs = list(pathlib.Path('/tmp/paper_repro_ci/core').glob('*.yaml'))
          assert len(configs) == 72, f'Expected 72, got {len(configs)}'
          for path in configs:
              c = yaml.safe_load(path.read_text())
              assert c['privacy_capture']['milestone_rounds'] == [1,10,30,50,75,100,125,150]
              assert c['privacy_capture']['full_group_projection_dim'] == 2048
              assert c['experiment']['paper_repro_historical_result'] is False
          print('PASS canonical Core72:', len(configs))
          PY
      - name: Validate integer L2 reference values
        run: python -m src.acm_revision.l2_reference
      - name: Run code and protocol checks (no private datasets)
        run: python -m unittest discover -s tests -p 'test_paper_repro.py' -v
      - name: Generate code-only provenance status (not numerical reproduction)
        run: python scripts/acm_revision/paper_repro_preflight.py --root . --json-out paper_preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-preflight-report
          path: paper_preflight.json

