name: ASLWF paper reproduction guards

on:
  push:
    branches: [paper-aslwf-repro-20261017]
    paths:
      - 'docs/paper_repro/**'
      - 'scripts/acm_revision/paper_repro_preflight.py'
      - 'scripts/acm_revision/audit_headfix.py'
      - 'scripts/acm_revision/verify_paper_table7.py'
      - 'src/acm_revision/**'
      - 'tests/test_paper_repro.py'
      - '.github/workflows/paper-aslwf-repro-ci.yml'
  workflow_dispatch:

jobs:
  reproducibility-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight manifest parser
        run: python -m pip install PyYAML numpy pandas Pillow
      - name: Compile paper tooling
        run: python -m py_compile src/acm_revision/paper_protocol_plan.py src/acm_revision/l2_budget.py src/acm_revision/defense_dispatch.py src/acm_revision/defense70_plan.py src/acm_revision/defense70_prepare.py src/acm_revision/headfix_plan.py scripts/acm_revision/paper_repro_preflight.py scripts/acm_revision/audit_headfix.py scripts/acm_revision/verify_paper_table7.py tests/test_paper_repro.py
      - name: Generate all 72 canonical Core72 configs
        run: |
          python -m src.acm_revision.paper_protocol_plan --stage core --output /tmp/paper_repro_ci
          python - <<'PY'
          import pathlib
          import yaml
          configs = list(pathlib.Path('/tmp/paper_repro_ci/core').glob('*.yaml'))
          assert len(configs) == 72, f'Expected 72, got {len(configs)}'
          for path in configs:
              c = yaml.safe_load(path.read_text())
              assert c['privacy_capture']['milestone_rounds'] == [1,10,30,50,75,100,125,150]
              assert c['privacy_capture']['full_group_projection_dim'] == 2048
              assert c['experiment']['paper_repro_historical_result'] is False
          print('PASS canonical Core72:', len(configs))
          PY
      - name: Run code and protocol checks (no private datasets)
        run: python -m unittest discover -s tests -p 'test_paper_repro.py' -v
      - name: Generate code-only provenance status (not numerical reproduction)
        run: python scripts/acm_revision/paper_repro_preflight.py --root . --json-out paper_preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-preflight-report
          path: paper_preflight.json

  l2-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch and protocol dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas PyYAML Pillow
      - name: Run actual Torch-backed original-coordinate L2 budget test
        run: |
          python -m unittest discover -s tests -p 'test_paper_repro.py' -v
