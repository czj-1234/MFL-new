name: ASLWF paper reproduction guards

on:
  push:
    branches: [paper-aslwf-repro-20261017]
    paths:
      - 'docs/paper_repro/**'
      - 'scripts/acm_revision/paper_repro_preflight.py'
      - 'scripts/acm_revision/audit_headfix.py'
      - 'tests/test_paper_repro.py'
      - '.github/workflows/paper-aslwf-repro-ci.yml'
  workflow_dispatch:

jobs:
  reproducibility-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight manifest parser
        run: python -m pip install PyYAML
      - name: Compile paper tooling
        run: python -m py_compile scripts/acm_revision/paper_repro_preflight.py scripts/acm_revision/audit_headfix.py tests/test_paper_repro.py
      - name: Run code and protocol checks (no private datasets)
        run: python -m unittest discover -s tests -p 'test_paper_repro.py' -v
      - name: Generate code-only provenance status (not numerical reproduction)
        run: python scripts/acm_revision/paper_repro_preflight.py --root . --json-out paper_preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-preflight-report
          path: paper_preflight.json
